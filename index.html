<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário Literário</title>

    <style>
        body {
            background-color: #eee6f5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            background-color: #8733db;
            color: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        form {
            background-color: #9b6bd6; 
            width: 520px; 
            padding: 25px;
            margin: auto;
            border-radius: 10px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: white;
        }

        input, textarea, select {
            width: 100%;
            padding: 9px;
            border-radius: 5px;
            border: none;
            font-family: Arial;
        }

        textarea {
            height: 85px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background-color: #5a1fa6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .tabela {
            width: 520px;
            margin: 30px auto;
            background-color: #9b6bd6;
            padding: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #8733db;
            color: white;
        }
    </style>
</head>

<body>

<h1>Descubra Seu Gênero Literário</h1>

<form>

    <label>Seu nome:</label>
    <input type="text" placeholder="Digite seu nome">

    <label>Idade:</label>
    <input type="number" placeholder="Digite sua idade">

    <label>Email:</label>
    <input type="email" placeholder="Digite seu email">

    <label>Qual gênero você lê mais?</label>
    <select onchange="mostrarGenero(this.value)">
        <option value="">Selecione...</option>
        <option value="0">Romance</option>
        <option value="1">Suspense</option>
        <option value="2">Fantasia</option>
        <option value="3">Terror</option>
        <option value="4">Drama</option>
    </select>

    <label>Por que você gosta desse gênero?</label>
    <textarea placeholder="Explique com suas palavras..."></textarea>

    <label>O que te faz perder o interesse em um livro?</label>
    <textarea placeholder="Ex: história parada, muitos clichês..."></textarea>

    <label>O que te faz gostar ainda mais de um livro?</label>
    <textarea placeholder="Ex: personagens fortes, reviravoltas..."></textarea>

    <label>Você já tentou outros gêneros além do seu favorito?</label>
    <textarea placeholder="Fale sobre sua experiência com outros gêneros..."></textarea>

    <label>Se você já leu outros gêneros, quais foram e por que você não gostou?</label>
    <textarea placeholder="Ex: li fantasia, mas não gostei porque..."></textarea>

    <button type="submit">Enviar</button>

</form>

<!-- TABELA (só exibição do resultado) -->
<div class="tabela">
    <table>
        <tr>
            <th>Gênero</th>
            <th>Descrição</th>
            <th>Conexão com você</th>
        </tr>
        <tr>
            <td id="genero">---</td>
            <td id="descricao">---</td>
            <td id="conexao">---</td>
        </tr>
    </table>
</div>

<script>
    let generos = [
        "Romance",
        "Suspense",
        "Fantasia",
        "Terror",
        "Drama"
    ];

    let descricoes = [
        "Sentimentos e relações amorosas.",
        "Mistério, tensão e reviravoltas.",
        "Mundos imaginários, magia e aventuras.",
        "Medo, suspense psicológico e situações assustadoras.",
        "Conflitos emocionais e reflexões sobre a vida."
    ];

    let conexoes = [
        "Você se conecta com emoções intensas e histórias baseadas em sentimentos.",
        "Você gosta de desafios mentais e histórias que prendem sua atenção.",
        "Você se identifica com mundos imaginários e liberdade criativa.",
        "Você busca sensações fortes e histórias que mexem com o psicológico.",
        "Você se conecta com histórias realistas e reflexões profundas."
    ];

    function mostrarGenero(posicao) {
        if (posicao !== "") {
            document.getElementById("genero").innerHTML = generos[posicao];
            document.getElementById("descricao").innerHTML = descricoes[posicao];
            document.getElementById("conexao").innerHTML = conexoes[posicao];
        }
    }
</script>

</body>
</html>
